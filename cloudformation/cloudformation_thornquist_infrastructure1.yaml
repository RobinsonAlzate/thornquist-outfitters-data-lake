AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation Template for Thornquist Outfitters S3 Data Lake Bucket.
  Team: Ammar Al-naqeeb, Robinson Alzate Bedoya, Alexander Orsulak.

Parameters:
  BucketName:
    Type: String
    Default: 'thornquist-outfitters-am-rob-alx'
    Description: Standardized S3 Data Lake Bucket Name.

Resources:
  # Primary S3 Data Lake Bucket
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  S3Bucket:
    Description: Provisioned S3 Data Lake Bucket
    Value: !Ref DataLakeBucket
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fully Automated CloudFormation Template for Thornquist Outfitters Data Lake.
  Team: Ammar Al-naqeeb, Robinson Alzate Bedoya, Alexander Orsulak.

Parameters:
  AWSAccountId:
    Type: String
    Default: '7850-6958-3533'
    Description: AWS Account ID. Change if deploying in a different account.
  BucketName:
    Type: String
    Default: 'thornquist-outfitters-am-rob-alx'
    Description: Standardized S3 Data Lake Bucket Name.

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ThornquistGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWSAccountId
      DatabaseInput:
        Name: thornquist_db
        Description: Data Catalog Database for Thornquist Outfitters.

  CuratedSalesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWSAccountId
      DatabaseName: !Ref ThornquistGlueDatabase
      TableInput:
        Name: curated_sales
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          parquet.compression: SNAPPY
        StorageDescriptor:
          Columns:
            - Name: order_id
              Type: string
            - Name: sale_date
              Type: string
            - Name: customer_id
              Type: string
            - Name: product_id
              Type: string
            - Name: product_name
              Type: string
            - Name: unit_price
              Type: double
            - Name: quantity
              Type: int
          Location: !Sub 's3://${BucketName}/curated/conformed_sales/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
        PartitionKeys:
          - Name: category
            Type: string

  ThornquistETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: thornquist-etl-pipeline
      Role: !Sub 'arn:aws:iam::${AWSAccountId}:role/LabRole'
      GlueVersion: '4.0'
      NumberOfWorkers: 2
      WorkerType: G.1X
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${BucketName}/scripts/glue_etl_pipeline.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-bookmark-option': 'job-bookmark-disable'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--TempDir': !Sub 's3://${BucketName}/athena-results/temp/'

Outputs:
  Bucket:
    Value: !Ref DataLakeBucket
  Database:
    Value: !Ref ThornquistGlueDatabase